jsr:
    coding:
        data-shards: 3
        parity-shards: 2
spring:
    rabbitmq:
        host: localhost
        username: admin
        password: 123456
        port: 5672
        virtual-host: my_vhost
        listener:
            direct:
                auto-startup: false
    servlet:
        multipart:
            max-file-size: 500MB
            max-request-size: 500MB
    application:
        name: ns-web
    main:
        allow-circular-references: true
    datasource:
        username: root
        password: 123456
        url: jdbc:mysql://localhost:3306/nebula_storage?useSSL=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            maximum-pool-size: 10
    data:
        redis:
            host: localhost
            port: 6379
            database: 0
            password: 123456
            lettuce:
                pool:
                    # 连接池最大连接数（使用负值表示没有限制）
                    max-active: 50
                    # 连接池最大阻塞等待时间（使用负值表示没有限制）
                    max-wait: 3000
                    # 连接池中的最大空闲连接数
                    max-idle: 20
                    # 连接池中的最小空闲连接数
                    min-idle: 5
                    # 连接超时时间（毫秒）
    cloud:
        nacos:
            discovery:
                server-addr: localhost:8848
                register-enabled: false
                username: nacos
                password: 123456
                namespace: service
sa-token:
    token-name: token
    timeout: 259200
    is-concurrent: false
    is-share: true
    token-style: random-32
    is-log: false


