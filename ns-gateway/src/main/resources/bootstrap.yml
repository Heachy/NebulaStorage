spring:
    config:
        import:
            - nacos:ns-gateway.yaml?refreshEnabled=true
    application:
        name: ns-gateway
    datasource:
        username: root
        password: 123456
        url: jdbc:mysql://localhost:3306/nebula_storage?useSSL=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            maximum-pool-size: 10
    data:
        redis:
            host: localhost
            port: 6379
            database: 0
            password: 123456
            lettuce:
                pool:
                    # 连接池最大连接数（使用负值表示没有限制）
                    max-active: 50
                    # 连接池最大阻塞等待时间（使用负值表示没有限制）
                    max-wait: 3000
                    # 连接池中的最大空闲连接数
                    max-idle: 20
                    # 连接池中的最小空闲连接数
                    min-idle: 5
                    # 连接超时时间（毫秒）
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true # 开启服务发现
                    lower-case-service-id: true
            routes:
                -   id: ns-web
                    uri: lb://ns-web
                    predicates:
                        - Path=/ns-web/**
                    filters:
                        - StripPrefix=1
                -   id: ns-storage
                    uri: lb://ns-storage
                    predicates:
                        - Path=/ns-storage/**
                    filters:
                        - StripPrefix=1
        nacos:
            server-addr: localhost:8848
            username: nacos
            password: 123456
            discovery:
                namespace: service
            config:
                namespace: nebulaStorage
                file-extension: yaml
                group: gateway


